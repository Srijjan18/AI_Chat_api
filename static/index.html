<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .ai .bubble {
            background: #e5e7eb;
            color: #111827;
            border-bottom-left-radius: 3px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        #sendButton {
            margin-left: 10px;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .typing {
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 Srijjan's AI Chat
    </div>

    <div id="chatMessages" class="chat-messages">

        <div class="message ai">
            <div class="bubble">
                Hello! 👋 Ask me anything.
            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<script>

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");


    function addMessage(message, type) {

        const messageDiv = document.createElement("div");

        messageDiv.classList.add("message", type);

        const bubble = document.createElement("div");

        bubble.classList.add("bubble");

        bubble.textContent = message;

        messageDiv.appendChild(bubble);

        chatMessages.appendChild(messageDiv);

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    async function sendMessage() {

        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        // Show user's message
        addMessage(message, "user");

        // Clear input
        messageInput.value = "";

        // Disable button while waiting
        sendButton.disabled = true;

        // Show typing message
        const typingDiv = document.createElement("div");

        typingDiv.classList.add("message", "ai");

        typingDiv.innerHTML = `
            <div class="bubble typing">
                AI is typing...
            </div>
        `;

        chatMessages.appendChild(typingDiv);

        chatMessages.scrollTop = chatMessages.scrollHeight;


        try {

            /*
             * This request goes to your FastAPI backend.
             *
             * Change "/chat" if your endpoint in main.py
             * has a different path.
             */

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            if (!response.ok) {
                throw new Error("Server error");
            }


            const data = await response.json();


            // Remove "AI is typing..."
            typingDiv.remove();


            /*
             * Your backend response should contain
             * something like:
             *
             * {
             *     "response": "An API is..."
             * }
             */

            addMessage(data.response, "ai");


        } catch (error) {

            typingDiv.remove();

            addMessage(
                "❌ Sorry, something went wrong. Please try again.",
                "ai"
            );

            console.error(error);

        } finally {

            sendButton.disabled = false;

            messageInput.focus();

        }

    }


    // Send when clicking button
    sendButton.addEventListener("click", sendMessage);


    // Send when pressing Enter
    messageInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
